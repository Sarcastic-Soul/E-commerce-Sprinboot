spring.application.name=e-commerce

# Local-only secrets, if present. `optional:` means nothing breaks when the file is
# absent, which is the case in CI and on Render — those supply real env vars instead.
# Both paths are listed so it resolves whether you run from /backend or the repo root.
spring.config.import=optional:file:./secrets.properties,optional:file:./backend/secrets.properties

# JPA
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
# `validate` so Hibernate never alters a live schema on boot. Note that validate
# does NOT create indexes either: after adding or changing an @Index, deploy once
# with DDL_AUTO=update to apply it, then unset the variable to go back to validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# HTTP compression — product/order JSON compresses ~5-8x.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=1024

#Image Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# PostgresDB (via Session Pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

#Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# 2s flagged every normal slow query (cold Neon connection, admin stats) as a leak.
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=0
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=0

# CORS — comma-separated origins. Set APP_CORS_ORIGINS on Render to the deployed URL.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,https://springboot-ecommerce-latest-ctgu.onrender.com}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=900000
jwt.refresh.expiration=604800000

# Access/refresh tokens ship as httpOnly cookies. Cross-origin prod (separate
# frontend/backend hosts) needs Secure + SameSite=None — that combination is the
# only one browsers send on a cross-site request at all. Local http dev overrides
# both in application-dev.properties, since Secure cookies are dropped over http.
app.jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
app.jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:None}

spring.cache.type=redis
spring.data.redis.url=${REDIS_URL}
spring.cache.redis.time-to-live=60m

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Virtual threads: blocking calls (Postgres, Redis, Razorpay, Cloudinary) no longer
# tie up one of Tomcat's 200 platform threads each.
spring.threads.virtual.enabled=true
