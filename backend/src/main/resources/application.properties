spring.application.name=e-commerce

# Vercel and most container hosts pass the port to listen on in PORT.
server.port=${PORT:8080}

# Local-only secrets, if present. `optional:` means nothing breaks when the file is
# absent, which is the case in CI and on Render — those supply real env vars instead.
# Both paths are listed so it resolves whether you run from /backend or the repo root.
spring.config.import=optional:file:./secrets.properties,optional:file:./backend/secrets.properties

# JPA
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
# `update` adds new tables, columns and indexes on boot and never drops anything,
# so a deploy with new entity fields needs no manual migration step. New non-null
# columns carry a database default so they can be added to tables that have rows.
# Set DDL_AUTO=validate to make boot fail on a mismatch instead.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# HTTP compression — product/order JSON compresses ~5-8x.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=1024

#Image Upload
# Vercel rejects request bodies over 4.5MB before they reach the app, so stay under it.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

# PostgresDB (via Session Pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

#Database
spring.datasource.driver-class-name=org.postgresql.Driver
# Serverless runs many small instances at once, each with its own pool, so set
# DB_POOL_SIZE low there (2-3) to stay inside the database's connection limit.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# 2s flagged every normal slow query (cold Neon connection, admin stats) as a leak.
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=0
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=0

# CORS — comma-separated origins. Set APP_CORS_ORIGINS on Render to the deployed URL.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,https://springboot-ecommerce-latest-ctgu.onrender.com}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=900000
jwt.refresh.expiration=604800000

# Access/refresh tokens ship as httpOnly cookies. Cross-origin prod (separate
# frontend/backend hosts) needs Secure + SameSite=None — that combination is the
# only one browsers send on a cross-site request at all. Local http dev overrides
# both in application-dev.properties, since Secure cookies are dropped over http.
app.jwt.cookie.secure=${JWT_COOKIE_SECURE:true}
app.jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:None}

# In-process cache for catalog reads. Each instance keeps its own copy and an
# admin edit only evicts it on the instance that handled the edit, so entries
# live briefly: other instances show a change within a minute.
spring.cache.type=caffeine
spring.cache.cache-names=products,product
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Virtual threads: blocking calls (Postgres, Razorpay, Cloudinary) no longer
# tie up one of Tomcat's 200 platform threads each.
spring.threads.virtual.enabled=true

# Serverless knobs (see README > Deployment). Defaults suit one long-running server.
# false on serverless: no process stays up to run timers.
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}
# memory | postgres: where the login/signup limit is counted. Use postgres when
# more than one instance serves traffic. Catalog limits are always in memory.
app.rate-limit.auth-store=${RATE_LIMIT_AUTH_STORE:memory}
# Header with the real client IP set by the platform edge, e.g. x-real-ip on Vercel.
app.client-ip-header=${CLIENT_IP_HEADER:}
# Shared secret for /api/internal/** (Vercel Cron sends it as a Bearer token).
# Blank disables those endpoints.
app.cron-secret=${CRON_SECRET:}
