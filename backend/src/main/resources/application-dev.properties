# Contents of application-dev.properties
spring.jpa.show-sql=true

# Local dev keeps the convenience of schema auto-sync; the base config uses validate.
spring.jpa.hibernate.ddl-auto=update
spring.devtools.restart.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/brutshop
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.data.redis.url=redis://localhost:6379

# Local http (no TLS): a Secure cookie would just be silently dropped by the
# browser, and SameSite=None requires Secure, so relax both for dev only.
app.jwt.cookie.secure=false
app.jwt.cookie.same-site=Lax

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
